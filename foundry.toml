[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# QDay Aevum Testnet runs the Shanghai EVM: Cancun opcodes (MCOPY, TLOAD/TSTORE, BLOB*) revert with invalid opcode.
solc_version = "0.8.24"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
aevum = "https://rpc-test.qday.info"
aevum_testnet = "https://rpc-test.qday.info"
local = "http://127.0.0.1:8545"
