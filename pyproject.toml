[project]
name = "aevum-agent-commerce"
version = "0.1.0"
description = "Verifiable Agentic Commerce & Escrow Protocol for Aevum Testnet (tUSD8)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sdk"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
